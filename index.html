<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4s Menu</title>
  <style>
    :root {
      --ui-font-family: "Segoe UI", Inter, system-ui, sans-serif;
      --ui-main: #d0d6e0;
      --ui-main-r: 208;
      --ui-main-g: 214;
      --ui-main-b: 224;
      --ui-back: #141414;
      --ui-back-r: 20;
      --ui-back-g: 20;
      --ui-back-b: 20;
      --menu-scale: 1;
      --aura-menu-opacity: 0.86;
      --menu-content-alpha: 0.86;
      --checkbox-color: rgb(208, 214, 224);
      --vh-u: 10.8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: var(--ui-font-family);
      color: #fff;
    }
    *::-webkit-scrollbar, *::-webkit-scrollbar-thumb, *::-webkit-scrollbar-track,
    *::-webkit-scrollbar-button, *::-webkit-scrollbar-corner {
      display: none !important; width: 0 !important; height: 0 !important;
    }
    #app { position: absolute; inset: 0; pointer-events: none; }

    #menu-root {
      font-family: var(--ui-font-family);
      color: #fff;
      position: fixed;
      top: 21.5vh;
      left: 14.25vh;
      width: 35vh;
      z-index: 1000;
      opacity: 0;
      transform: scale(0.95);
      pointer-events: auto;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-root.visible { opacity: 1; transform: scale(var(--menu-scale, 1)); }
    #menu-root.hiding { opacity: 0; transform: scale(0.95); }

    #tooltip-container {
      font-family: var(--ui-font-family);
      position: fixed;
      top: 21.5vh;
      left: calc(14.25vh + 35vh + 0.5vh);
      width: 20vh;
      background-color: rgb(20, 20, 20);
      border-radius: 0.45vh;
      padding: 0.9vh 1.4vh;
      font-size: 1.3vh;
      display: none;
      opacity: 0;
      z-index: 1100;
      pointer-events: none;
    }
    #tooltip-container.visible { display: block; opacity: 1; }
    .tooltip-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5vh; }
    .tooltip-item:last-child { margin-bottom: 0; }
    .tooltip-label { color: rgba(255,255,255,0.85); }
    .tooltip-value { font-weight: 500; color: rgba(255,255,255,0.85); }

    #header-wrapper {
      background-color: var(--ui-back);
      border-radius: 0.45vh;
      overflow: hidden;
      margin-bottom: 0.45vh;
    }
    #menu-banner { padding: 0; overflow: hidden; }
    #banner-image { width: 100%; height: 10vh; object-fit: cover; display: block; }

    #menu-container {
      background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), var(--aura-menu-opacity));
      border-radius: 0.45vh;
      overflow: hidden;
      position: relative;
    }

    #menu-tabs { display: flex; width: 100%; }
    .tab-item {
      flex: 1; min-width: 0; padding: 0.8vh 0; font-size: 1.1vh; text-align: center;
      color: rgba(255,255,255,0.6); background: transparent;
      border-bottom-left-radius: 0.5vh; border-bottom-right-radius: 0.5vh;
      position: relative; overflow: hidden; font-family: var(--ui-font-family);
    }
    .tab-item::before {
      content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.3) 0%, transparent 85%);
      transform: scaleY(0); transform-origin: bottom; transition: 0.5s; z-index: -1;
    }
    .tab-item.active { color: #fff; font-weight: 500; }
    .tab-item.active::before { transform: scaleY(1); }
    .tab-item.full {
      flex: 1 1 100%; width: 100%; min-width: 100%;
      text-align: center; font-weight: 600; letter-spacing: 0.04em;
      color: #fff; font-size: 1.15vh;
    }

    #menu-items { position: relative; max-height: 39vh; overflow: hidden; }
    #items-list { position: relative; }
    #selection-highlight {
      position: absolute; margin-top: 0.2vh; left: 0.2vh; right: 0.2vh; height: 2.6vh;
      background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35);
      border: 0.1vh solid rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35);
      box-shadow: 0 0 0.2vh 0.2vh rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35);
      border-radius: 0.4vh; z-index: 0; pointer-events: none;
    }
    .menu-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75vh 1vh; font-size: 1.2vh; height: 3vh; box-sizing: border-box;
      position: relative; z-index: 1; gap: 0.8vh;
    }
    .menu-item.sep { justify-content: center; pointer-events: none; }
    .item-left { display: flex; align-items: center; gap: 0.7vh; min-width: 0; flex: 1; }
    .item-icon { width: 1.6vh; height: 1.6vh; object-fit: contain; flex-shrink: 0; }
    .item-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-right { display: flex; align-items: center; gap: 0.8vh; flex-shrink: 0; }
    .sep-wrap { display: flex; align-items: center; width: 100%; gap: 1vh; }
    .sep-bar { flex: 1; height: 0.3vh; background-color: rgba(255,255,255,0.8); border-radius: 0.2vh; }
    .sep-text { color: rgba(255,255,255,0.9); font-weight: 500; white-space: nowrap; }
    .slider-txt { font-size: 1.15vh; }
    .slider-txt::before { content: "- "; color: rgba(255,255,255,0.55); }
    .slider-txt::after { content: " -"; color: rgba(255,255,255,0.55); }
    .range-wrap { width: 8vh; height: 1.6vh; position: relative; display: flex; align-items: center; }
    .range-track { position: absolute; left: 0; width: 100%; height: 0.35vh; background: rgba(255,255,255,0.2); border-radius: 0.2vh; }
    .range-fill { position: absolute; left: 0; height: 0.35vh; background: #fff; border-radius: 0.2vh; }
    .pid { opacity: 0.55; font-size: 1.05vh; }

    .toggle-switch {
      width: 2.78vh; height: 1.39vh; min-width: 2.78vh; min-height: 1.39vh;
      background-color: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5vh;
      position: relative; flex-shrink: 0;
      display: flex; align-items: center;
    }
    .toggle-switch.active {
      background-color: var(--checkbox-color);
      border-color: var(--checkbox-color);
    }
    .toggle-knob {
      position: absolute; left: 0.21vh; top: 50%; transform: translateY(-50%);
      width: 0.89vh; height: 0.89vh; border-radius: 50%;
      background-color: rgba(255,255,255,0.65);
    }
    .toggle-switch.active .toggle-knob {
      left: 1.56vh; background-color: #fff;
    }

    #menu-footer {
      background-color: var(--ui-back);
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 0.45vh; padding: 0.45vh 0.95vh; font-size: 1.15vh;
      margin-top: 0.45vh; height: 2.15vh;
    }
    #footer-left { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #footer-right { font-family: Consolas, monospace; opacity: 0.85; }

    .external-scrollbar {
      width: 0.85vh; height: 39vh;
      position: absolute; top: 0; left: -1.13vh;
      display: none; align-items: stretch; justify-content: center;
    }
    .external-scrollbar.show { display: flex; }
    .scrollbar-shell {
      width: 0.42vh; height: 100%;
      display: flex; flex-direction: column; align-items: center;
    }
    .scrollbar-arrow {
      flex: 0 0 auto; width: 100%; height: 0.72vh;
      display: flex; align-items: center; justify-content: center;
    }
    .scrollbar-arrow:before {
      content: ""; display: block; width: 0; height: 0;
      border-left: 0.2vh solid transparent; border-right: 0.2vh solid transparent;
    }
    .scrollbar-arrow-up:before { border-bottom: 0.24vh solid var(--ui-main); }
    .scrollbar-arrow-down:before { border-top: 0.24vh solid var(--ui-main); }
    .scrollbar-track {
      flex: 1 1 auto; width: 0.22vh; min-height: 0;
      position: relative; background: #000; border-radius: 0.08vh;
    }
    .scrollbar-thumb {
      position: absolute; left: 0; width: 100%;
      background: var(--ui-main); border-radius: 0.06vh; min-height: 1.2vh;
    }

    #items-clip { position: relative; }

    #notification-container {
      position: fixed; top: 2vh; right: 2vh; z-index: 2000;
      display: flex; flex-direction: column; align-items: flex-end; gap: 1vh;
      pointer-events: none; width: 30vh; font-family: var(--ui-font-family);
    }
    .notification {
      width: 100%; min-height: 5.5vh;
      background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
      padding: 1.1vh 1.5vh 1.1vh 1.5vh;
      display: flex; flex-direction: column; gap: 0.35vh;
      box-sizing: border-box; transform: translateX(100%); opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden;
    }
    .notification.show { transform: translateX(0); opacity: 1; }
    .notification.hide { transform: translateX(100%); opacity: 0; }
    .notification-side { position: absolute; top: -1.1vh; left: 0; height: calc(100% + 2.2vh); width: 0.3vh; }
    .notification-header { font-weight: 600; font-size: 1.4vh; color: #fff; }
    .notification-message { font-size: 1.1vh; color: rgba(255,255,255,0.85); line-height: 1.4; }
    .notification-progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 0.3vh; }
    .notification-progress-bar { height: 100%; width: 100%; transform-origin: left; transition: transform linear; }

    .input-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999999;
      display: none; pointer-events: auto; font-family: var(--ui-font-family);
    }
    .input-overlay.show { display: block; }
    .input-box {
      background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.88);
      border-radius: 0.25vh; display: flex; flex-direction: column;
      position: fixed; bottom: 17.5vh; left: 50%; transform: translateX(-50%);
      width: 55vh; overflow: hidden;
    }
    .input-header { padding: 0.8vh 1vh; border-bottom: 0.1vh solid var(--ui-main); font-size: 1.2vh; }
    .input-box input, .input-key {
      padding: 1.25vh 1vh; border: none; outline: none; background: transparent;
      color: #fff; font-size: 1.2vh; font-family: var(--ui-font-family);
    }

    .keybindlist-container {
      position: fixed; z-index: 99999; width: 138px;
      background: rgba(0,0,0,var(--menu-content-alpha));
      border: 1px solid #2a2a2a; border-radius: 3px;
      overflow: hidden; opacity: 0; pointer-events: none;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .keybindlist-container.show { opacity: 1; pointer-events: auto; }
    .keybind-list-header {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 5px 6px 3px; background: #000;
      border-bottom: 1px solid var(--ui-main);
    }
    .keybind-list-title { color: rgba(255,255,255,0.92); font-size: 9px; font-weight: 600; }
    .keybind-list-content { padding: 3px 0 0; max-height: 165px; overflow: hidden; }
    .keybind-list-row {
      display: flex; justify-content: space-between; gap: 6px;
      padding: 2px 5px 2px 3px;
    }
    .keybind-list-label, .keybind-list-value {
      color: rgba(255,255,255,0.86); font-size: 9px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .keybind-list-value { flex: 0 0 auto; max-width: 46%; text-align: right; }

    #spec-list {
      position: fixed; z-index: 99998; width: 150px;
      background: rgba(0,0,0,var(--menu-content-alpha));
      border: 1px solid #2a2a2a; border-radius: 3px;
      overflow: hidden; opacity: 0; font-family: var(--ui-font-family); font-size: 9px;
    }
    #spec-list.show { opacity: 1; }
    #spec-list .keybind-list-header { cursor: default; }

    #aura-player-info {
      position: fixed; z-index: 2147483000; display: none; flex-direction: column;
      width: 13.6vw; border-radius: 0.28vw; background: rgba(8,8,10,0.62);
      padding: 0.18vw 0.5vw 0.32vw; pointer-events: none;
      font-family: var(--ui-font-family);
    }
    #aura-player-info.show { display: flex; }
    #aura-player-info .api-row { display: flex; justify-content: space-between; min-height: 0.7vw; padding: 0.04vw 0; }
    #aura-player-info .api-l { color: #fff; font-size: 0.46vw; }
    #aura-player-info .api-v { color: #fff; font-size: 0.46vw; font-weight: 600; }

    #SharkLoadingOverlay {
      position: fixed; inset: 0; display: none; z-index: 2147483646;
      background: rgba(0,0,0,0.72); pointer-events: auto;
    }
    #SharkLoadingOverlay.active { display: flex; align-items: center; justify-content: center; }
    .shark-load-inner { width: 36vh; text-align: center; }
    .shark-load-text { font-size: 1.35vh; margin-bottom: 1.2vh; }
    .shark-load-bar { height: 0.65vh; background: rgba(20,20,20,0.85); border-radius: 0.35vh; overflow: hidden; }
    #SharkProgressBar { height: 100%; width: 0; background: var(--ui-main); }
    #SharkLoadingPercent { margin-top: 0.8vh; font-size: 1.1vh; font-weight: 700; }
    #SharkLoadingSubtext { margin-top: 0.5vh; font-size: 1.15vh; opacity: 0.85; }

    #fc-hud {
      position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
      display: none; z-index: 1400; pointer-events: none;
      font-family: var(--ui-font-family); font-size: 1.2vh;
      background: rgba(20,20,20,0.8); padding: 0.6vh 1.2vh; border-radius: 0.4vh;
    }
    #fc-hud.show { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <div id="SharkLoadingOverlay">
      <div class="shark-load-inner">
        <div class="shark-load-text" id="SharkLoadingTitle">4s Menu</div>
        <div class="shark-load-bar"><div id="SharkProgressBar"></div></div>
        <div id="SharkLoadingPercent">0%</div>
        <div id="SharkLoadingSubtext">Please wait, loading menu...</div>
      </div>
    </div>

    <div id="menu-root">
      <div class="external-scrollbar" id="ext-scroll">
        <div class="scrollbar-shell">
          <div class="scrollbar-arrow scrollbar-arrow-up"></div>
          <div class="scrollbar-track"><div class="scrollbar-thumb" id="scroll-thumb"></div></div>
          <div class="scrollbar-arrow scrollbar-arrow-down"></div>
        </div>
      </div>
      <div id="header-wrapper">
        <div id="menu-banner"><img id="banner-image" alt="Menu Banner" draggable="false" /></div>
      </div>
      <div id="menu-container">
        <div id="menu-tabs"></div>
        <div id="menu-items">
          <div id="items-clip">
            <div id="selection-highlight"></div>
            <div id="items-list"></div>
          </div>
        </div>
      </div>
      <div id="menu-footer">
        <div id="footer-left">4s Menu</div>
        <div id="footer-right"></div>
      </div>
    </div>

    <div id="tooltip-container"></div>
    <div id="notification-container"></div>

    <div class="keybindlist-container" id="keybindlist-container" style="top:2vh;left:2vh;">
      <div class="keybind-list-header">
        <div class="keybind-list-title">Keybinds</div>
      </div>
      <div class="keybind-list-content" id="keybindlist-content"></div>
    </div>

    <div id="spec-list" style="top:2vh;left:2vh;">
      <div class="keybind-list-header"><div class="keybind-list-title">Spectators</div></div>
      <div class="keybind-list-content" id="spec-content"></div>
    </div>

    <div id="aura-player-info"></div>

    <div class="input-overlay" id="input-overlay">
      <div class="input-box">
        <div class="input-header" id="input-title">Input</div>
        <input id="input-field" autocomplete="off" spellcheck="false" />
        <div class="input-key" id="input-key" style="display:none;"></div>
      </div>
    </div>

    <div id="fc-hud"></div>
  </div>
  <script>
(function () {
  window.__AURA_NEXUS = true;
  window.__AURA_SAFE_LOGO = window.__AURA_SAFE_LOGO || "https://pca6982-dot.github.io/cinema/4s-menu.jpg";
  window.__AURA_BANNER_URL = window.__AURA_BANNER_URL || window.__AURA_SAFE_LOGO;
  window.__AURA_BRAND = window.__AURA_BRAND || "4s Menu";
  window.__AURA_MENU_RGB = window.__AURA_MENU_RGB || [208, 214, 224];
  window.__auraMenuOpacity = typeof window.__auraMenuOpacity === "number" ? window.__auraMenuOpacity : 0.86;
  window.__auraIsMainMenu = true;
  window.__auraSectionTitle = "Main Menu";

  var root = document.getElementById("menu-root");
  var tabsEl = document.getElementById("menu-tabs");
  var listEl = document.getElementById("items-list");
  var hiEl = document.getElementById("selection-highlight");
  var thumbEl = document.getElementById("scroll-thumb");
  var extScroll = document.getElementById("ext-scroll");
  var bannerImg = document.getElementById("banner-image");
  var footL = document.getElementById("footer-left");
  var footR = document.getElementById("footer-right");
  var tipEl = document.getElementById("tooltip-container");
  var notifEl = document.getElementById("notification-container");
  var kbBox = document.getElementById("keybindlist-container");
  var kbContent = document.getElementById("keybindlist-content");
  var specBox = document.getElementById("spec-list");
  var specContent = document.getElementById("spec-content");
  var overlay = document.getElementById("input-overlay");
  var inputField = document.getElementById("input-field");
  var inputKey = document.getElementById("input-key");
  var inputTitle = document.getElementById("input-title");
  var fcHud = document.getElementById("fc-hud");

  var state = {
    visible: false,
    items: [],
    index: 0,
    window: 0,
    page: 13,
    tabs: [],
    tabIndex: 0,
    title: "Main Menu",
    mainIcons: true,
    footMode: 0
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function safeImg(u) {
    var s = String(u || "");
    if (s.indexOf("data:image") === 0) return s;
    if (!s || s.indexOf("127.0.0.1") >= 0 || s.indexOf("localhost") >= 0 || s.indexOf("http://") === 0)
      return window.__AURA_SAFE_LOGO;
    return s;
  }
  function parseColor(color) {
    if (!color) return null;
    var s = String(color).trim();
    var m = s.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (m) return [parseInt(m[1], 10) || 0, parseInt(m[2], 10) || 0, parseInt(m[3], 10) || 0];
    var h = s.replace("#", "");
    if (h.length === 6) return [parseInt(h.slice(0, 2), 16) || 0, parseInt(h.slice(2, 4), 16) || 0, parseInt(h.slice(4, 6), 16) || 0];
    return null;
  }
  function hexOf(rgb) {
    function hx(n) { return ("0" + (n & 255).toString(16)).slice(-2); }
    return "#" + hx(rgb[0]) + hx(rgb[1]) + hx(rgb[2]);
  }
  function applyTheme(rgb) {
    rgb = rgb || window.__AURA_MENU_RGB || [208, 214, 224];
    window.__AURA_MENU_RGB = rgb;
    var csv = rgb[0] + "," + rgb[1] + "," + rgb[2];
    var hx = hexOf(rgb);
    var st = document.documentElement.style;
    st.setProperty("--ui-main", hx);
    st.setProperty("--ui-main-r", rgb[0]);
    st.setProperty("--ui-main-g", rgb[1]);
    st.setProperty("--ui-main-b", rgb[2]);
    st.setProperty("--menu-color", csv);
    st.setProperty("--aura-accent", "rgb(" + csv + ")");
    st.setProperty("--checkbox-color", "rgb(" + csv + ")");
    st.setProperty("--theme-accent", hx);
    st.setProperty("--accent-color", hx);
  }
  function applyOpacity() {
    var n = window.__auraMenuOpacity;
    if (typeof n !== "number" || !isFinite(n)) n = 0.86;
    n = Math.max(0.12, Math.min(1, n));
    window.__auraMenuOpacity = n;
    document.documentElement.style.setProperty("--aura-menu-opacity", String(n));
    document.documentElement.style.setProperty("--menu-content-alpha", String(n));
  }
  window.__auraParseMenuColor = parseColor;
  window.__auraApplyTheme = applyTheme;
  window.__auraApplyMenuOpacity = applyOpacity;
  window.__auraSetMenuOpacity = function (v) {
    var n = Number(v);
    if (n > 1) n = n / 100;
    window.__auraMenuOpacity = Math.max(0.12, Math.min(1, n || 0.86));
    applyOpacity();
  };
  window.__auraSafeImg = safeImg;
  window.__auraBannerCache = window.__auraBannerCache || {};
  window.__auraPreloadBanners = function (urls) {
    if (!urls) return;
    for (var i = 0; i < urls.length; i++) {
      var u = safeImg(urls[i]);
      if (!u || window.__auraBannerCache[u]) continue;
      var im = new Image();
      im.src = u;
      window.__auraBannerCache[u] = im;
    }
  };
  window.__auraApplyBanner = function (url, color) {
    var link = safeImg(url || window.__AURA_BANNER_URL);
    window.__AURA_BANNER_URL = link;
    if (bannerImg) bannerImg.src = link;
    var parts = parseColor(color);
    if (parts) applyTheme(parts);
  };
  window.__auraApplyDiscordProfile = function () {
    paintFooter();
  };
  window.__auraSyncFooterDiscord = paintFooter;
  window.__auraSyncMainIcons = function () { renderItems(); };
  window.__auraSyncSectionTitle = function () {
    state.title = window.__auraSectionTitle || "Main Menu";
    renderTabs();
  };
  window.__auraEnsureLiteCss = function () {};
  window.__auraEnsureLoader = function () { return document.getElementById("SharkLoadingOverlay"); };
  window.__auraPaintSharkLoader = function (p, text, avatar, hide) {
    var L = window.__auraEnsureLoader();
    if (!L) return;
    p = Math.max(0, Math.min(100, Number(p) || 0));
    var bar = document.getElementById("SharkProgressBar");
    var percentText = document.getElementById("SharkLoadingPercent");
    var subtext = document.getElementById("SharkLoadingSubtext");
    if (hide || p >= 100) {
      if (bar) bar.style.width = "100%";
      if (percentText) percentText.innerText = "100%";
      if (subtext && text) subtext.innerText = text;
      window.__auraLoaderDone = true;
      L.classList.remove("active");
      L.style.display = "none";
      return;
    }
    L.style.display = "flex";
    L.classList.add("active");
    if (bar) bar.style.width = p + "%";
    if (percentText) percentText.innerText = Math.round(p) + "%";
    if (subtext && text) subtext.innerText = text;
  };
  window.__auraConfirmMenuKey = function (v) {
    inputKey.textContent = v || "";
  };
  window.__auraPreviewMenuKey = function (v) {
    inputKey.textContent = v || "";
  };
  window.__auraSyncKeyPickerUi = function (preview, v) {
    showKeyPicker(true, v);
  };

  function setVisible(on) {
    state.visible = !!on;
    if (on) {
      root.classList.remove("hiding");
      root.classList.add("visible");
    } else {
      root.classList.remove("visible");
      root.classList.add("hiding");
    }
  }

  function paintFooter() {
    var name = window.__AURA_DISCORD_NAME || "Discord";
    if (state.footMode === 1) footL.textContent = "discord.gg/auramenu";
    else footL.textContent = name;
    var n = state.items.length;
    var i = n ? (state.index + 1) : 0;
    footR.textContent = i + " / " + n;
  }

  function itemType(el) {
    return String((el && el.type) || "button").toLowerCase();
  }
  function isSep(el) {
    var t = itemType(el);
    return t === "divider" || t === "separator";
  }
  function isCheck(el) {
    var t = itemType(el);
    return t === "checkbox" || t === "scrollable-checkbox" || t === "slider-checkbox";
  }
  function isScroll(el) {
    var t = itemType(el);
    return t === "scrollable" || t === "scroll" || t === "scrollable-checkbox";
  }
  function isSlider(el) {
    var t = itemType(el);
    return t === "slider" || t === "slider-checkbox";
  }
  function valsOf(el) {
    return (el && (el.values || el.options || el.scrollOptions)) || [];
  }
  function valIndex(el) {
    var vals = valsOf(el);
    var v = el && el.value;
    if (typeof v === "number") {
      if (v >= 1 && v <= vals.length) return v - 1;
      if (v >= 0 && v < vals.length) return v;
    }
    var i = vals.indexOf(v);
    return i >= 0 ? i : 0;
  }

  function renderTabs() {
    var cats = state.tabs || [];
    var html = "";
    if (!cats.length) {
      html = '<div class="tab-item full active">' + esc(window.__auraSectionTitle || state.title || "Main Menu") + "</div>";
    } else {
      for (var i = 0; i < cats.length; i++) {
        var lab = (cats[i] && (cats[i].label || cats[i].title || cats[i].name)) || ("Tab " + (i + 1));
        html += '<div class="tab-item' + (i === state.tabIndex ? " active" : "") + '">' + esc(lab) + "</div>";
      }
    }
    tabsEl.innerHTML = html;
  }

  function rightHtml(el) {
    var h = "";
    if (el && el.serverId != null) h += '<span class="pid">[' + esc(el.serverId) + "]</span>";
    if (isScroll(el)) {
      var vals = valsOf(el);
      var vi = valIndex(el);
      var cur = vals[vi] != null ? vals[vi] : (el.value != null ? el.value : "");
      h += '<span class="slider-txt">' + esc(cur) + "</span>";
    } else if (isSlider(el) && !isScroll(el)) {
      var min = Number(el.min) || 0, max = Number(el.max) || 100, val = Number(el.value) || 0;
      var pct = max === min ? 0 : ((val - min) / (max - min)) * 100;
      h += '<span class="slider-txt">' + esc(val) + '</span><div class="range-wrap"><div class="range-track"></div><div class="range-fill" style="width:' + pct + '%"></div></div>';
    }
    if (isCheck(el)) {
      h += '<div class="toggle-switch' + (el.checked ? " active" : "") + '"><div class="toggle-knob"></div></div>';
    }
    return h;
  }

  function renderItems() {
    var items = state.items || [];
    var page = state.page;
    if (state.index < state.window) state.window = state.index;
    if (state.index >= state.window + page) state.window = state.index - page + 1;
    if (state.window < 0) state.window = 0;
    var maxW = Math.max(0, items.length - page);
    if (state.window > maxW) state.window = maxW;

    var html = "";
    var end = Math.min(items.length, state.window + page);
    var showIcons = window.__auraIsMainMenu === true || state.mainIcons === true;
    for (var i = state.window; i < end; i++) {
      var el = items[i] || {};
      if (isSep(el)) {
        html += '<div class="menu-item sep"><div class="sep-wrap"><div class="sep-bar"></div><div class="sep-text">' + esc(el.label || "") + '</div><div class="sep-bar"></div></div></div>';
        continue;
      }
      var icon = "";
      if (showIcons && el.icon) {
        var src = String(el.icon);
        if (src.indexOf("<svg") === 0) icon = '<span class="item-icon">' + el.icon + "</span>";
        else if (src.indexOf("http") === 0 || src.indexOf("data:") === 0) icon = '<img class="item-icon" src="' + esc(safeImg(src)) + '" />';
      }
      html += '<div class="menu-item"><div class="item-left">' + icon + '<span class="item-label">' + esc(el.label || "") + '</span></div><div class="item-right">' + rightHtml(el) + "</div></div>";
    }
    listEl.innerHTML = html;

    var local = state.index - state.window;
    hiEl.style.top = (local * 3) + "vh";
    hiEl.style.display = items.length ? "block" : "none";

    var needBar = items.length > page;
    extScroll.classList.toggle("show", needBar);
    if (needBar) {
      var ratio = page / items.length;
      var h = Math.max(8, ratio * 100);
      var top = (state.window / Math.max(1, items.length - page)) * (100 - h);
      thumbEl.style.height = h + "%";
      thumbEl.style.top = top + "%";
    }

    var cur = items[state.index];
    if (cur && cur.desc) {
      tipEl.classList.add("visible");
      tipEl.innerHTML = '<div class="tooltip-item"><span class="tooltip-label">' + esc(cur.desc) + "</span></div>";
    } else {
      tipEl.classList.remove("visible");
      tipEl.innerHTML = "";
    }
    paintFooter();
  }

  function applyMenu(d, open) {
    if (d && d.visible === false) { setVisible(false); return; }
    if (open || d.visible === true) setVisible(true);
    if (d.elements) state.items = d.elements;
    if (typeof d.index === "number") state.index = Math.max(0, d.index);
    if (typeof d.isMainMenu === "boolean") {
      window.__auraIsMainMenu = d.isMainMenu;
      state.mainIcons = d.isMainMenu;
    }
    if (d.categories) {
      state.tabs = d.categories;
      state.tabIndex = Math.max(0, Number(d.categoryIndex) || 0);
    }
    if (d.clearCategories) state.tabs = [];
    renderTabs();
    renderItems();
  }

  function notifColor(type) {
    var t = String(type || "info").toLowerCase();
    if (t === "error" || t === "danger") return "#e74c3c";
    if (t === "success") return "#2cc45a";
    if (t === "warning" || t === "warn") return "#f1c40f";
    return hexOf(window.__AURA_MENU_RGB || [208, 214, 224]);
  }
  function showNotif(d) {
    var n = document.createElement("div");
    n.className = "notification";
    var col = notifColor(d.type);
    var title = d.title || window.__AURA_BRAND || "4s Menu";
    var msg = d.message || d.desc || d.description || "";
    n.innerHTML = '<div class="notification-side" style="background:' + col + '"></div>'
      + '<div class="notification-header">' + esc(title) + "</div>"
      + (msg ? '<div class="notification-message">' + esc(msg) + "</div>" : "")
      + '<div class="notification-progress"><div class="notification-progress-bar" style="background:' + col + '"></div></div>';
    notifEl.appendChild(n);
    requestAnimationFrame(function () { n.classList.add("show"); });
    var bar = n.querySelector(".notification-progress-bar");
    var ms = Number(d.duration) || 3500;
    if (bar) {
      bar.style.transitionDuration = ms + "ms";
      requestAnimationFrame(function () { bar.style.transform = "scaleX(0)"; });
    }
    setTimeout(function () {
      n.classList.add("hide");
      setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 320);
    }, ms);
  }

  function showInput(on, title, value, keyMode) {
    overlay.classList.toggle("show", !!on);
    inputTitle.textContent = title || (keyMode ? "Press a key" : "Input");
    inputField.style.display = keyMode ? "none" : "block";
    inputKey.style.display = keyMode ? "block" : "none";
    if (keyMode) inputKey.textContent = value || "";
    else inputField.value = value || "";
  }
  function showKeyPicker(on, v) { showInput(on, "Press a key", v || "", true); }

  window.__auraShowGateToast = function (msg) {
    showNotif({ type: "info", title: window.__AURA_BRAND, message: msg || "" });
  };
  window.__auraShowPlayerInfo = function (d) {
    var el = document.getElementById("aura-player-info");
    if (!el || !d) return;
    var rows = d.rows || d.lines || [];
    var html = "";
    if (d.name) html += '<div class="api-row"><span class="api-l">Name</span><span class="api-v">' + esc(d.name) + "</span></div>";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r) continue;
      html += '<div class="api-row"><span class="api-l">' + esc(r.label || r.k || "") + '</span><span class="api-v">' + esc(r.value || r.v || "") + "</span></div>";
    }
    el.innerHTML = html;
    el.classList.add("show");
    if (d.x != null) el.style.left = d.x + "px";
    if (d.y != null) el.style.top = d.y + "px";
  };
  window.__auraHidePlayerInfo = function () {
    var el = document.getElementById("aura-player-info");
    if (el) el.classList.remove("show");
  };

  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== "object") return;
    if (!d.action && d.type) d.action = d.type;
    var a = d.action;
    if (!a) return;

    if (a === "showUI") applyMenu(d, true);
    else if (a === "updateElements" || a === "setCurrent") applyMenu(d, false);
    else if (a === "keydown" || a === "setSelection") {
      if (typeof d.index === "number") state.index = Math.max(0, d.index);
      if (typeof d.current === "number") state.index = Math.max(0, d.current - 1);
      renderItems();
    } else if (a === "updateCategories" || a === "setTabs") {
      if (d.tabs) {
        state.tabs = d.tabs;
        state.tabIndex = Math.max(0, (Number(d.activeTabId) || 1) - 1);
      } else {
        state.tabs = d.categories || [];
        state.tabIndex = Math.max(0, Number(d.categoryIndex) || 0);
      }
      if (d.clearCategories) state.tabs = [];
      renderTabs();
    } else if (a === "setVisible") setVisible(d.visible !== false);
    else if (a === "setMainMenuIcons") {
      state.mainIcons = d.enabled === true;
      window.__auraIsMainMenu = d.enabled === true;
      renderItems();
    } else if (a === "updateBanner") window.__auraApplyBanner(d.bannerLink || d.link, d.bannerColor || d.color);
    else if (a === "showNotification" || a === "notify") showNotif(d);
    else if (a === "showGateToast") window.__auraShowGateToast(d.message);
    else if (a === "showPlayerInfo") window.__auraShowPlayerInfo(d);
    else if (a === "hidePlayerInfo") window.__auraHidePlayerInfo();
    else if (a === "updateMenuSize") {
      var pct = Number(d.size) || 100;
      document.documentElement.style.setProperty("--menu-scale", String(pct / 100));
    } else if (a === "setMenuBackground" || a === "updateMenuOpacity") {
      window.__auraSetMenuOpacity(d.alpha != null ? d.alpha : d.opacity);
    } else if (a === "updatePositionPrecise") {
      var p = d.position || {};
      if (p.x != null) root.style.left = p.x + "vw";
      if (p.y != null) root.style.top = p.y + "vh";
    } else if (a === "displayBinds" || a === "toggleKeybindListUI") {
      var on = d.visible === true;
      kbBox.classList.toggle("show", on);
      if (on && (d.binds || d.keybinds)) {
        var binds = d.binds || d.keybinds || [];
        var h = "";
        for (var bi = 0; bi < binds.length; bi++) {
          var b = binds[bi] || {};
          h += '<div class="keybind-list-row"><span class="keybind-list-label">' + esc(b.label || b.name || "")
            + '</span><span class="keybind-list-value">' + esc(b.keyLabel || b.key || "-") + "</span></div>";
        }
        kbContent.innerHTML = h;
      }
    } else if (a === "updateKeybindList") {
      var kb = d.keybinds || [];
      var kh = "";
      for (var ki = 0; ki < kb.length; ki++) {
        var k = kb[ki] || {};
        kh += '<div class="keybind-list-row"><span class="keybind-list-label">' + esc(k.name || k.label || "")
          + '</span><span class="keybind-list-value">' + esc(k.key || k.keyLabel || "-") + "</span></div>";
      }
      kbContent.innerHTML = kh;
    } else if (a === "updateKeybindListPosition") {
      var kp = d.position || {};
      if (kp.x != null) kbBox.style.left = kp.x + "vw";
      if (kp.y != null) kbBox.style.top = kp.y + "vh";
    } else if (a === "displaySpectators" || a === "toggleSpectatorListUI") {
      specBox.classList.toggle("show", d.visible === true);
      if (d.spectators) {
        var sh = "";
        for (var si = 0; si < d.spectators.length; si++) {
          var sp = d.spectators[si] || {};
          sh += '<div class="keybind-list-row"><span class="keybind-list-label">' + esc(sp.name || "Unknown")
            + '</span><span class="keybind-list-value">' + esc(Math.floor(sp.distance || 0)) + "m</span></div>";
        }
        specContent.innerHTML = sh;
      }
    } else if (a === "updateSpectatorList") {
      var sl = d.spectators || [];
      var slh = "";
      for (var sj = 0; sj < sl.length; sj++) {
        var sq = sl[sj] || {};
        slh += '<div class="keybind-list-row"><span class="keybind-list-label">' + esc(sq.name || "Unknown")
          + '</span><span class="keybind-list-value">' + esc(Math.floor(sq.distance || 0)) + "m</span></div>";
      }
      specContent.innerHTML = slh;
    } else if (a === "updateSpectatorListPosition") {
      var spp = d.position || {};
      if (spp.x != null) specBox.style.left = spp.x + "vw";
      if (spp.y != null) specBox.style.top = spp.y + "vh";
    } else if (a === "updateLoader" || a === "showLoading" || a === "updateLoading" || a === "hideLoading") {
      var pr = Number(d.percent != null ? d.percent : d.progress) || 0;
      var msg = d.text || d.status || d.message || "Please wait, loading menu...";
      window.__auraPaintSharkLoader(pr, msg, d.avatar, a === "hideLoading" || pr >= 100);
    } else if (a === "openKeySelection" || a === "updateKeySelection") {
      showKeyPicker(true, d.keyName || d.value || d.message || "");
    } else if (a === "closeKeySelection") showKeyPicker(false, "");
    else if (a === "updateKeyboard") {
      if (d.visible === false) showInput(false);
      else if (d.menuKey === true) showKeyPicker(true, d.value || "");
      else showInput(true, d.title || "Input", d.value || "", false);
    } else if (a === "openTextInput") showInput(true, d.title || "Input", d.value || "", false);
    else if (a === "updateTextInput") inputField.value = d.value || "";
    else if (a === "closeTextInput") showInput(false);
    else if (a === "setArgsPanel" || a === "setDiscordProfile" || a === "updateFooterUser") {
      if (typeof d.name === "string" && d.name.trim()) window.__AURA_DISCORD_NAME = d.name;
      if (typeof d.username === "string" && d.username.trim()) window.__AURA_DISCORD_NAME = d.username;
      if (typeof d.avatar === "string" && d.avatar.trim()) window.__AURA_DISCORD_AVATAR = d.avatar;
      paintFooter();
    } else if (a === "displayFreecam" || a === "updateFreecam") {
      var vis = d.visible !== false && d.hide !== true;
      fcHud.classList.toggle("show", vis);
      if (vis) {
        var feats = d.features || d.options || [];
        var sel = d.featureIndex != null ? Number(d.featureIndex) : ((Number(d.index) || 0) + 1);
        var lab = feats[sel - 1] || feats[sel] || d.sub || "Freecam";
        fcHud.textContent = typeof lab === "string" ? lab : (lab && lab.label) || "Freecam";
      }
    } else if (a === "freecamHide" || a === "toggleFreecamUI") {
      fcHud.classList.toggle("show", d.visible === true);
    }
  }, true);

  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Alt" || ev.key === "AltGraph" || ev.keyCode === 18) {
      ev.preventDefault();
      ev.stopPropagation();
    }
  }, true);

  applyTheme(window.__AURA_MENU_RGB);
  applyOpacity();
  if (bannerImg) bannerImg.src = safeImg(window.__AURA_BANNER_URL);
  renderTabs();
  renderItems();
  setInterval(function () {
    state.footMode = state.footMode === 0 ? 1 : 0;
    paintFooter();
  }, 4500);
})();
  </script>
</body>
</html>
