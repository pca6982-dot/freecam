<body>
  <div id="app"></div>
  <script src="app.js"></script>
  <script>
(function () {
  window.__AURA_NEXUS = true;
  window.__AURA_BRAND = window.__AURA_BRAND || "4s Menu";

  function esc(s) { return s == null ? "" : String(s); }
  function rm(n) {
    if (!n) return;
    try { n.parentNode.removeChild(n); } catch (e) {
      n.style.setProperty("display", "none", "important");
    }
  }
  function killDupes() {
    document.querySelectorAll("#progress-container,#progress-box,#progress-bar,#aura-loader,.loading-scale-layer,.zt-load-screen,.zt-card.zt-loading,.shark-load-inner,.input-overlay,#aura-key-pick,#live-list-keybinds,.live-list-container").forEach(rm);
    document.querySelectorAll("#SharkLoadingOverlay").forEach(function (n, i) { if (i > 0) rm(n); });
    var keep = document.getElementById("aura-keybind-hud") || document.getElementById("keybindlist-container");
    document.querySelectorAll(".keybindlist-container,#keybindlist-container,#aura-keybind-hud").forEach(function (n) {
      if (keep && n === keep) return;
      rm(n);
    });
  }

  function wrapNotify() {
    if (!window.showNotification || window.showNotification.__auraWrap) return;
    var orig = window.showNotification;
    window.showNotification = function (type, title, msg, dur, icon) {
      return orig.call(window, type, "", msg, dur, icon);
    };
    window.showNotification.__auraWrap = true;
  }
  wrapNotify();
  function wrapLive() {
    if (!window.updateLiveTabContent || window.updateLiveTabContent.__auraWrap) return;
    var orig = window.updateLiveTabContent;
    window.updateLiveTabContent = function (t, e) {
      t = t || [];
      for (var i = 0; i < t.length; i++) {
        var it = t[i];
        if (!it) continue;
        if (it.checkbox && (it.slider || it.range)) continue;
        var ty = String(it.type || "").toLowerCase();
        if (ty === "submenu" || ty === "button" || ty === "divider" || ty === "separator" || ty === "") {
          it.checkbox = undefined;
        }
      }
      var list = document.getElementById("items-list");
      if (list) list.innerHTML = "";
      return orig.call(window, t, e);
    };
    window.updateLiveTabContent.__auraWrap = true;
  }
  wrapLive();

  function styleScroll() {
    var bar = document.getElementById("menu-scrollbar");
    if (!bar) return;
    bar.style.setProperty("width", "0.85vh", "important");
    bar.style.setProperty("left", "-1.13vh", "important");
    bar.style.setProperty("display", "flex", "important");
    bar.style.setProperty("flex-direction", "column", "important");
    bar.style.setProperty("align-items", "center", "important");
    bar.style.setProperty("background", "transparent", "important");
    bar.style.setProperty("opacity", "1", "important");
    bar.style.setProperty("border-radius", "0", "important");
    if (!bar.querySelector(".aura-sb-up")) {
      var up = document.createElement("div");
      up.className = "aura-sb-up";
      var dn = document.createElement("div");
      dn.className = "aura-sb-down";
      bar.insertBefore(up, bar.firstChild);
      bar.appendChild(dn);
    }
    var track = document.getElementById("scrollbar-track");
    if (track) {
      track.style.setProperty("width", "0.22vh", "important");
      track.style.setProperty("max-width", "0.22vh", "important");
      track.style.setProperty("height", "auto", "important");
      track.style.setProperty("flex", "1 1 auto", "important");
      track.style.setProperty("min-height", "0", "important");
      track.style.setProperty("background", "#000", "important");
      track.style.setProperty("border-radius", "0.08vh", "important");
    }
    var thumb = document.getElementById("scrollbar-thumb");
    if (thumb) {
      thumb.style.setProperty("width", "100%", "important");
      thumb.style.setProperty("left", "0", "important");
      thumb.style.setProperty("border-radius", "0.06vh", "important");
      thumb.style.setProperty("background", "var(--ui-main)", "important");
      thumb.style.setProperty("box-shadow", "none", "important");
    }
    var items = document.getElementById("menu-items");
    var root = document.getElementById("menu-root");
    if (items && root) {
      var rr = root.getBoundingClientRect();
      var ir = items.getBoundingClientRect();
      var s = 1;
      var tr = window.getComputedStyle(root).transform;
      if (tr && tr !== "none") {
        var m = tr.match(/matrix\(([^,]+)/);
        if (m) s = parseFloat(m[1]) || 1;
      }
      if (s < 0.2) s = 1;
      bar.style.setProperty("top", ((ir.top - rr.top) / s) + "px", "important");
      bar.style.setProperty("height", (ir.height / s) + "px", "important");
    }
  }

  function fullTitle() {
    var bar = document.getElementById("menu-tabs");
    if (!bar) return;
    bar.style.setProperty("width", "100%", "important");
    bar.style.setProperty("display", "flex", "important");
    var tabs = bar.querySelectorAll(".tab-item");
    var one = tabs.length <= 1;
    tabs.forEach(function (n) {
      n.classList.toggle("single", one);
      n.classList.toggle("full", one);
      if (one) {
        n.style.setProperty("flex", "1 1 100%", "important");
        n.style.setProperty("width", "100%", "important");
        n.style.setProperty("text-align", "center", "important");
      }
    });
  }

  function forceMenuChrome() {
    var root = document.getElementById("menu-root");
    if (!root || !root.classList.contains("visible")) return;
    ["header-wrapper", "menu-container", "menu-footer", "menu-scrollbar"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.add("visible");
      el.classList.remove("hiding");
    });
  }
  function pinNotif() {
    var nc = document.getElementById("notification-container");
    if (!nc) return;
    nc.style.setProperty("top", "1.4vh", "important");
    nc.style.setProperty("left", "50%", "important");
    nc.style.setProperty("right", "auto", "important");
    nc.style.setProperty("bottom", "auto", "important");
    nc.style.setProperty("transform", "translateX(-50%)", "important");
    nc.style.setProperty("align-items", "center", "important");
    nc.style.setProperty("width", "26vh", "important");
    nc.style.setProperty("gap", "0.4vh", "important");
    nc.querySelectorAll(".notification-header,.notification-icon").forEach(function (n) {
      n.style.setProperty("display", "none", "important");
    });
  }

  function applyMenuPos(d) {
    var p = (d && d.position) || d || {};
    var x = p.x != null ? p.x : d && d.x;
    var y = p.y != null ? p.y : d && d.y;
    var menu = document.getElementById("menu-root");
    if (!menu) return;
    if (x != null && isFinite(Number(x))) menu.style.setProperty("left", Number(x) + "vh", "important");
    if (y != null && isFinite(Number(y))) menu.style.setProperty("top", Number(y) + "vh", "important");
  }
  function applyMenuScale(size) {
    var pct = Number(size);
    if (!isFinite(pct)) return;
    var s = pct / 100;
    document.documentElement.style.setProperty("--menu-scale", String(s));
    var menu = document.getElementById("menu-root");
    if (menu) {
      menu.style.setProperty("transform", "scale(" + s + ")", "important");
      menu.style.setProperty("transform-origin", "top left", "important");
    }
  }
  function applyMenuOpacity(n) {
    n = Number(n);
    if (!isFinite(n)) n = window.__auraMenuOpacity || 0.86;
    if (n > 1) n = n / 100;
    n = Math.max(0.15, Math.min(1, n));
    window.__auraMenuOpacity = n;
    var chrome = Math.max(0.18, Math.min(1, n + 0.04));
    var r = document.documentElement.style.getPropertyValue("--ui-back-r") || "20";
    var g = document.documentElement.style.getPropertyValue("--ui-back-g") || "20";
    var b = document.documentElement.style.getPropertyValue("--ui-back-b") || "20";
    var contentBg = "rgba(" + r + "," + g + "," + b + "," + n + ")";
    var chromeBg = "rgba(" + r + "," + g + "," + b + "," + chrome + ")";
    document.documentElement.style.setProperty("--aura-content-alpha", String(n));
    document.documentElement.style.setProperty("--aura-chrome-alpha", String(chrome));
    document.querySelectorAll("#header-wrapper,#menu-footer").forEach(function (el) {
      el.style.setProperty("background-color", chromeBg, "important");
    });
    document.querySelectorAll("#menu-container").forEach(function (el) {
      el.style.setProperty("background-color", contentBg, "important");
    });
    document.querySelectorAll("#menu-items").forEach(function (el) {
      el.style.setProperty("background-color", "transparent", "important");
    });
  }
  window.__auraApplyMenuOpacity = function () { applyMenuOpacity(window.__auraMenuOpacity); };
  window.__auraSetMenuOpacity = function (v) { applyMenuOpacity(v); };
  function applyKeybindPos(d) {
    var p = (d && d.position) || d || {};
    var box = document.getElementById("aura-keybind-hud") || document.getElementById("keybindlist-container");
